<!DOCTYPE html>
<html>

<head>
    <link rel="Stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/CD-Faialense-tab-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js" defer></script>
    <title>Standings | CD Faialense</title>
</head>

<body>

    <main class="standings-page">

        
        <h1>Standings</h1>

        <p class="standings-subtitle" id="season-subtitle">
            Bay State Soccer League — 2026 Season
        </p>

        <div class="season-selector">
            <label for="season-select">Choose Season:</label>
            <select id="season-select">
                <option value="2026" selected>2026 Season</option>
                <option value="2025">2025 Season</option>
                <option value="2024">2024 Season</option>
                <option value="2023">2023 Season</option>
            </select>
        </div>


        <div class="table-container">

            <table class="standings-table">

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>GP</th>
                        <th>W</th>
                        <th>L</th>
                        <th>T</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>PTS</th>
                    </tr>
                </thead>

                <tbody id="standings-body">
                    <tr>
                        <td colspan="10">Loading standings...</td>
                    </tr>
                </tbody>

            </table>

        </div>

        <div class="legend-items">
            <span><strong>GP</strong> = Games Played</span>
            <span><strong>W</strong> = Wins</span>
            <span><strong>L</strong> = Losses</span>
            <span><strong>T</strong> = Ties</span>
            <span><strong>GF</strong> = Goals For</span>
            <span><strong>GA</strong> = Goals Against</span>
            <span><strong>GD</strong> = Goal Difference</span>
            <span><strong>PTS</strong> = Points</span>
        </div>

        <a
            class="official-standings-link"
            href="https://www.bssl.com/b_tables.php"
            target="_blank">
            View Official BSSL Standings
        </a>

    </main>

</body>

</html>
